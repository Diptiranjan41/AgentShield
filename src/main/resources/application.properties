spring.application.name=agentshield

# Database: values come from environment variables, nothing secret is committed
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agentshield}
spring.datasource.username=${DB_USER:agentshield}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Temporary admin account for Phase 1. Set SPRING_SECURITY_USER_PASSWORD to choose the password,
# otherwise Spring prints a random one at startup.
spring.security.user.name=admin
spring.security.user.roles=ADMIN
